# The main pipeline for etl_citibike

resources:
  pipelines:
    etl_citibike_etl:
      name: etl_citibike_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/etl_citibike_etl"

      libraries:
        - glob:
            include: ../src/etl_citibike_etl/transformations/**

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}
