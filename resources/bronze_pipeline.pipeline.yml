resources:
  pipelines:
    dab_bronze_pipeline:
      name: dab_bronze_pipeline
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}
      serverless: true
      root_path: ../src/etl_citibike_etl
      libraries:
        - glob:
            include: ../src/etl_citibike_etl/transformations/**
      configuration:
        "pipelines.reset.allowed": "true"
      clusters:
        - label: default
          autoscale:
            min_workers: 1
            max_workers: 2
      continuous: false
